name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"   # diario, 00:00 hora de México
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo para publicar la rama output
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
